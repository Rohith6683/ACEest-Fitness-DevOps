apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-ab-nginx-config
data:
  default.conf: |
    map $http_x_test_group $backend {
        default aceest-shadow-production;
        A aceest-shadow-production;
        B aceest-shadow-candidate;
    }

    server {
        listen 80;
        resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;

        location / {
            proxy_pass http://$backend.default.svc.cluster.local:5000$request_uri;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-ab-proxy
  template:
    metadata:
      labels:
        app: aceest-ab-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: aceest-ab-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab-service
spec:
  type: NodePort
  selector:
    app: aceest-ab-proxy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084
