apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-canary
      version: stable
  template:
    metadata:
      labels:
        app: aceest-canary
        version: stable
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-canary
      version: canary
  template:
    metadata:
      labels:
        app: aceest-canary
        version: canary
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:1.1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
spec:
  type: NodePort
  selector:
    app: aceest-canary
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082
