apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-production
spec:
  selector:
    app: aceest-bg
    version: blue
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-candidate
spec:
  selector:
    app: aceest-bg
    version: green
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-shadow-nginx-config
data:
  default.conf: |
    server {
        listen 80;
        resolver 10.96.0.10 valid=30s ipv6=off;

        location / {
            limit_except GET {
                deny all;
            }
            mirror /shadow;
            mirror_request_body off;
            proxy_pass http://aceest-shadow-production:5000;
        }

        location = /shadow {
            internal;
            proxy_pass http://aceest-shadow-candidate.default.svc.cluster.local:5000$request_uri;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Shadow-Request true;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-shadow-proxy
  template:
    metadata:
      labels:
        app: aceest-shadow-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: aceest-shadow-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-service
spec:
  type: NodePort
  selector:
    app: aceest-shadow-proxy
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
