apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      version: blue
  template:
    metadata:
      labels:
        app: aceest-bg
        version: blue
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-bg
      version: green
  template:
    metadata:
      labels:
        app: aceest-bg
        version: green
    spec:
      containers:
        - name: aceest-fitness
          image: aceest-fitness:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg-service
spec:
  type: NodePort
  selector:
    app: aceest-bg
    version: blue
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30081
